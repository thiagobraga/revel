name: Pipeline
on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md', '.specs/**']
  pull_request:
    branches: [main]
    paths-ignore: ['**/*.md', '.specs/**']
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    uses: ./.github/workflows/quality.yml
