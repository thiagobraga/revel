name: Deploy
on:
  workflow_dispatch:
    inputs:
      deploy:
        description: Notify the configured VPS deployment receiver after publishing images
        type: boolean
        default: false
permissions: {contents: read, packages: write}
concurrency: {group: revel-production, cancel-in-progress: false}
jobs:
  quality:
    uses: ./.github/workflows/quality.yml
  build:
    needs: quality
    runs-on: ubuntu-24.04
    strategy: {matrix: {package: [api, app]}}
    steps:
      - name: Require a main release
        env: {RELEASE_REF: "${{ github.ref }}"}
        run: test "$RELEASE_REF" = refs/heads/main
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with: {registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}'}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: .docker/${{ matrix.package }}/Dockerfile
          target: production
          build-args: BUILD_REVISION=${{ github.sha }}
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/revel-${{ matrix.package }}:${{ github.sha }}
          sbom: true
          provenance: mode=max
  deploy:
    if: inputs.deploy
    needs: build
    runs-on: ubuntu-24.04
    environment: {name: production, url: "https://revel.thiagobraga.dev"}
    steps:
      - name: Notify configured deploy receiver
        env:
          DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
          DEPLOY_WEBHOOK_TOKEN: ${{ secrets.DEPLOY_WEBHOOK_TOKEN }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          test -n "$DEPLOY_WEBHOOK_URL" && test -n "$DEPLOY_WEBHOOK_TOKEN"
          curl --fail --silent --show-error --proto '=https' -X POST -H "Authorization: Bearer $DEPLOY_WEBHOOK_TOKEN" -H 'Content-Type: application/json' --data "{\"imageTag\":\"$IMAGE_TAG\"}" "$DEPLOY_WEBHOOK_URL"
