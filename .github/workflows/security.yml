name: Security
on:
  push: {branches: [main]}
  pull_request: {branches: [main]}
  schedule: [{cron: '41 5 * * 1'}]
permissions: {contents: read, security-events: write}
jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: {node-version: '24'}
      - run: npm --prefix api ci && npm --prefix api audit --audit-level=high
      - run: npm --prefix app ci && npm --prefix app audit --audit-level=high
      - run: npm --prefix api sbom --sbom-format=cyclonedx > api-sbom.json && npm --prefix app sbom --sbom-format=cyclonedx > app-sbom.json
      - uses: actions/upload-artifact@v7
        with: {name: sbom, path: '*-sbom.json'}
  codeql:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with: {languages: javascript-typescript}
      - uses: github/codeql-action/analyze@v4
  containers:
    runs-on: ubuntu-24.04
    strategy: {matrix: {package: [api, app]}}
    steps:
      - uses: actions/checkout@v7
      - run: docker build -f .docker/${{ matrix.package }}/Dockerfile --target production -t revel-${{ matrix.package }}:scan .
      - uses: aquasecurity/trivy-action@0.36.0
        with: {image-ref: 'revel-${{ matrix.package }}:scan', severity: 'HIGH,CRITICAL', exit-code: '1', ignore-unfixed: true}
