x-api-environment: &api-environment
  NODE_ENV: production
  PORT: 4000
  CORS_ORIGIN: ${CORS_ORIGIN:?required HTTPS production origin}
  DATABASE_URL_FILE: /run/secrets/database_url
  REDIS_URL_FILE: /run/secrets/redis_url
  CSRF_SECRET_FILE: /run/secrets/csrf_secret
  RESEND_API_KEY_FILE: /run/secrets/resend_api_key
  EMAIL_FROM: ${EMAIL_FROM:?verified sending address required}
  SESSION_IDLE_TTL_MINUTES: ${SESSION_IDLE_TTL_MINUTES:-30}
  SESSION_ABSOLUTE_TTL_HOURS: ${SESSION_ABSOLUTE_TTL_HOURS:-12}
x-api-secrets: &api-secrets [database_url, redis_url, csrf_secret, resend_api_key]
x-hardened: &hardened
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  restart: unless-stopped
services:
  gateway:
    <<: *hardened
    image: nginxinc/nginx-unprivileged:1.31-alpine
    user: '101:101'
    ports: ['127.0.0.1:8080:8080']
    volumes: ['./.docker/app/nginx.conf:/etc/nginx/conf.d/default.conf:ro']
    tmpfs: ['/tmp:uid=101,gid=101', '/var/cache/nginx:uid=101,gid=101']
    networks: [edge, backend]
    depends_on:
      app: {condition: service_healthy}
      api: {condition: service_healthy}
    healthcheck:
      test: [CMD, wget, -qO-, 'http://127.0.0.1:8080/health']
      interval: 10s
      timeout: 5s
      retries: 10
  app:
    <<: *hardened
    image: ghcr.io/${GHCR_OWNER:-thiagobraga}/revel-app:${IMAGE_TAG:-latest}
    build: {context: ., dockerfile: .docker/app/Dockerfile, target: production, args: {BUILD_REVISION: '${IMAGE_TAG:-local}'}}
    user: '1000:1000'
    environment:
      NODE_ENV: production
      INTERNAL_API_URL: http://api:4000
      NEXT_PUBLIC_SITE_URL: ${CORS_ORIGIN:?required}
      SPOTIFY_URL: ${SPOTIFY_URL:-}
      BANDCAMP_URL: ${BANDCAMP_URL:-}
      YOUTUBE_URL: ${YOUTUBE_URL:-}
      INSTAGRAM_URL: ${INSTAGRAM_URL:-}
      CONTACT_URL: ${CONTACT_URL:-}
      PETROLEO_URL: ${PETROLEO_URL:-}
    tmpfs: ['/tmp:uid=1000,gid=1000', '/app/.next/cache:uid=1000,gid=1000']
    networks: [backend]
    depends_on:
      api: {condition: service_healthy}
  api:
    <<: *hardened
    image: ghcr.io/${GHCR_OWNER:-thiagobraga}/revel-api:${IMAGE_TAG:-latest}
    build: {context: ., dockerfile: .docker/api/Dockerfile, target: production, args: {BUILD_REVISION: '${IMAGE_TAG:-local}'}}
    user: '1000:1000'
    environment: *api-environment
    secrets: *api-secrets
    tmpfs: ['/tmp:uid=1000,gid=1000']
    networks: [backend, data, egress]
    depends_on:
      migrate: {condition: service_completed_successfully}
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
  migrate:
    <<: *hardened
    healthcheck: {disable: true}
    restart: 'no'
    image: ghcr.io/${GHCR_OWNER:-thiagobraga}/revel-api:${IMAGE_TAG:-latest}
    build: {context: ., dockerfile: .docker/api/Dockerfile, target: production, args: {BUILD_REVISION: '${IMAGE_TAG:-local}'}}
    user: '1000:1000'
    command: [node, dist/db/migrate.js]
    environment: *api-environment
    secrets: *api-secrets
    tmpfs: ['/tmp:uid=1000,gid=1000']
    networks: [data]
    depends_on:
      postgres: {condition: service_healthy}
  cleanup:
    <<: *hardened
    healthcheck: {disable: true}
    image: ghcr.io/${GHCR_OWNER:-thiagobraga}/revel-api:${IMAGE_TAG:-latest}
    user: '1000:1000'
    command: [sh, -c, 'while true; do node dist/db/cleanup.js; sleep 3600; done']
    environment: *api-environment
    secrets: *api-secrets
    tmpfs: ['/tmp:uid=1000,gid=1000']
    networks: [data]
    depends_on:
      migrate: {condition: service_completed_successfully}
  postgres:
    <<: *hardened
    image: postgres:16-alpine
    cap_add: [CHOWN, SETUID, SETGID, DAC_OVERRIDE]
    environment:
      POSTGRES_USER_FILE: /run/secrets/postgres_user
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB_FILE: /run/secrets/postgres_db
    secrets: [postgres_user, postgres_password, postgres_db]
    volumes: [pgdata:/var/lib/postgresql/data]
    tmpfs: [/tmp, /var/run/postgresql]
    networks: [data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$(cat /run/secrets/postgres_user)" -d "$$(cat /run/secrets/postgres_db)"']
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    <<: *hardened
    image: redis:7-alpine
    user: '999:999'
    command: [sh, -c, 'exec redis-server /etc/redis/redis.conf --requirepass "$$(cat /run/secrets/redis_password)" --appendonly yes']
    secrets: [redis_password]
    volumes: [redisdata:/data, './.docker/redis/redis.conf:/etc/redis/redis.conf:ro']
    tmpfs: [/tmp]
    networks: [data]
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$$(cat /run/secrets/redis_password)" redis-cli ping | grep -q PONG']
      interval: 5s
      timeout: 5s
      retries: 10
  backup:
    <<: *hardened
    image: postgres:16-alpine
    profiles: [operations]
    user: '1000:1000'
    entrypoint: [/bin/sh, /backup.sh]
    environment: {PGHOST: postgres}
    secrets: [postgres_user, postgres_password, postgres_db]
    volumes: ['./scripts/backup.sh:/backup.sh:ro', '${BACKUP_DIR:-./backups}:/backups']
    tmpfs: ['/tmp:uid=1000,gid=1000']
    networks: [data]
secrets:
  database_url: {file: '${DATABASE_URL_FILE:-./secrets/database_url}'}
  redis_url: {file: '${REDIS_URL_FILE:-./secrets/redis_url}'}
  csrf_secret: {file: '${CSRF_SECRET_FILE:-./secrets/csrf_secret}'}
  resend_api_key: {file: '${RESEND_API_KEY_FILE:-./secrets/resend_api_key}'}
  postgres_user: {file: '${POSTGRES_USER_FILE:-./secrets/postgres_user}'}
  postgres_password: {file: '${POSTGRES_PASSWORD_FILE:-./secrets/postgres_password}'}
  postgres_db: {file: '${POSTGRES_DB_FILE:-./secrets/postgres_db}'}
  redis_password: {file: '${REDIS_PASSWORD_FILE:-./secrets/redis_password}'}
networks:
  edge: {}
  backend: {internal: true}
  data: {internal: true}
  egress: {}
volumes: {pgdata: {}, redisdata: {}}
