map $http_upgrade $connection_upgrade { default upgrade; '' close; }
# TLS terminates at the trusted host proxy, before this loopback-only gateway.
map $http_x_forwarded_proto $forwarded_proto { default $scheme; https https; http http; }
server {
  listen 8080;
  server_name _;
  server_tokens off;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  location /api/ { proxy_pass http://api:4000; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $http_x_forwarded_for; proxy_set_header X-Forwarded-Proto $forwarded_proto; }
  location /socket.io { proxy_pass http://api:4000; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection $connection_upgrade; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $http_x_forwarded_for; proxy_set_header X-Forwarded-Proto $forwarded_proto; proxy_read_timeout 65s; }
  location /_next/static/ { proxy_pass http://app:3000; add_header Cache-Control "public, max-age=31536000, immutable"; }
  location / { proxy_pass http://app:3000; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $forwarded_proto; add_header Cache-Control "no-store"; }
}
